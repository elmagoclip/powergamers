name: Coleta XP Olden 74

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Recupera o histórico do site publicado
        run: |
          mkdir -p out
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git show FETCH_HEAD:history.json.gz > out/history.json.gz 2>/dev/null || rm -f out/history.json.gz
          fi

      - name: Coleta o ranking e calcula as janelas
        run: python3 collect.py out

      - name: Publica o site (branch gh-pages)
        run: |
          cp *.html out/
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "coleta-bot"
          git config user.email "coleta-bot@users.noreply.github.com"
          git add -A
          git commit -qm "coleta $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
